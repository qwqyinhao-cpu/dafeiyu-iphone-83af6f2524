<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8f3ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="个人大肥鱼：精细动画、触摸抛掷和倾斜重力。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'"><title>大肥鱼</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="icon" href="assets/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="room" aria-label="大肥鱼的房间"><canvas id="pet" aria-label="拖动大肥鱼，松手抛出；轻轻摸头与她互动"></canvas><div id="bubble" role="status" hidden></div><div class="gravity" aria-hidden="true"><span id="gravityArrow">↓</span></div></main>
<header><div class="brand"><span class="whale">◒</span><span>大肥鱼</span></div><button id="settingsButton" class="round" aria-label="设置">⚙</button></header>
<div id="loading" class="notice">正在叫醒大肥鱼…</div>
<footer><button id="motionButton" class="primary">开启倾斜重力</button><button id="actionsButton" class="round" aria-label="选择动作">✦</button><button id="resetButton" class="round" aria-label="把大肥鱼放回中间">↺</button><div id="hint">抓起来甩一甩 · 轻轻摸摸头</div></footer>
<dialog id="settings"><div class="dialogTitle"><h1>她的小房间</h1><button class="round close" aria-label="关闭设置">×</button></div><label>重力<input id="gravityInput" type="range" min="0.3" max="2" step="0.1"></label><label>甩动灵敏度<input id="motionInput" type="range" min="0.3" max="2" step="0.1"></label><label>弹性<input id="bounceInput" type="range" min="0.2" max="0.9" step="0.05"></label><label>角色大小<input id="sizeInput" type="range" min="0.65" max="1.15" step="0.05"></label><label class="check"><span>偶尔显示台词</span><input id="talkInput" type="checkbox"></label><label class="check"><span>角色声音（离线）</span><input id="voiceInput" type="checkbox"></label><button id="voicePreview" class="secondary">试听角色声音</button><p id="voiceStatus" class="small">16句内置角色配音；自定义文字没有录音时只显示文字。</p><label>台词 · 每行一句<textarea id="linesInput" rows="4" maxlength="2000"></textarea></label><button id="offlineButton" class="secondary">保存动画，离线也能玩</button><p id="offlineStatus" class="small"></p><p id="versionStatus" class="small"></p><p id="sensorStatus" class="small">运动传感器尚未开启</p><details><summary>添加到主屏幕与素材来源</summary><p>在 Safari 中打开，点分享，再选择“添加到主屏幕”。从新图标打开后，点“开启倾斜重力”并允许运动权限。</p><p>只在这个房间打开时互动。iPhone 主屏幕和其他应用上方的悬浮不在本版本支持范围内。</p><p>程序基础与动画来源：<a href="https://github.com/MerZlin/dsh-pet-indesktop" target="_blank" rel="noopener noreferrer">MerZlin</a>、<a href="https://github.com/PC2005-cloud/dsh-pet" target="_blank" rel="noopener noreferrer">PC2005-cloud/dsh-pet</a>。角色创作者依用户提供的信息为“这个刀子真甜”，第三方署名见<a href="credits.txt">完整声明</a>。仅供个人非商业使用。</p></details></dialog>
<dialog id="actions"><div class="dialogTitle"><h1>想看她做什么？</h1><button class="round close" aria-label="关闭动作选择">×</button></div><div id="actionList"></div></dialog>
<script type="module" src="app.js"></script></body></html>
